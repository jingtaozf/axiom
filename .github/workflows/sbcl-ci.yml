name: axiom SBCL build + regression

# Builds Axiom from source under SBCL and runs the src/input regression suite
# (excluding a few non-portable tests, see ci/run-regression.sh) sharded across
# 5 parallel jobs -- on BOTH macOS arm64 (Makefile.MACOSX) and Ubuntu x86_64
# (Makefile.LINUX), so the SBCL port is exercised on two OSes and two arches.
#
# Why this shape:
#  - The suite is dominated by ~106 rich*/richder* (Risch integration) tests at
#    60-120s each; on one 3-core runner that is ~22 min even with a dynamic
#    queue.  GitHub caps FREE macOS concurrency at 5 jobs, so we split the suite
#    into 5 timing-balanced shards that run at once -> ~5 min wall-clock.
#  - The algebra build is long but cached on a source hash; the build runs once
#    in `mac-build` / `linux-build`, and the 5 `*-test` shards restore that cache
#    instead of rebuilding.
#  - An exact cache-key hit means nothing affecting the build changed, so the
#    restored tree is reused without recompiling.

on:
  push:
    branches: ['**']        # every branch (jt, master, feature branches)
    paths-ignore:
      - 'books/**.pdf'
      - 'changelog'
  workflow_dispatch:

# Never let two builds of the same ref race on the cache / burn the 5-job cap.
concurrency:
  group: sbcl-ci-${{ github.ref }}
  cancel-in-progress: true

# Silence Homebrew's "untrusted taps" notice on the macOS runners: aws/tap and
# azure/bicep are pre-tapped in the runner image, not by us, and we install only
# homebrew/core formulae.  This keeps the current behaviour during Homebrew's
# trust transition; the notice self-resolves once the runner flips the default.
# No effect on the Linux jobs (no Homebrew there).
env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  mac-build:
    runs-on: macos-14
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    env:
      LISPFLAVOR: sbcl
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          set -x
          # sbcl: the Lisp host. gawk: Makefile uses gawk. gnu-sed/grep: a few
          # recipes assume GNU behaviour. coreutils: gtimeout for the runner.
          # Drop runner-preinstalled third-party taps we do not use; brew otherwise
          # scans them and surfaces their formula-import errors + deprecations as
          # job annotations (hashicorp vagrant.rb import failure, aws/tap SAM notice).
          brew untap aws/tap azure/bicep hashicorp/tap 2>/dev/null || true
          brew install sbcl gawk gnu-sed grep coreutils || true
          sbcl --version
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin"      >> "$GITHUB_PATH"
          # macos-14 has no /usr/include and clang's default sysroot is /, so
          # the few C bits (tanglec) cannot find <stdio.h> etc.  Point CPATH at
          # the SDK so relative includes resolve.  We build only interp+algebra
          # (see below), which compiles no X11/graphics C, so no X11 is needed.
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CPATH=$(xcrun --show-sdk-path)/usr/include"
          } >> "$GITHUB_ENV"

      - name: Compute cache key
        id: key
        # Single source of truth for the key so the `test` shards restore exactly
        # what `build` saved.  Hash ONLY genuine build inputs -- NOT ci/run-
        # regression.sh or the workflow.  Including non-build files would bust the
        # key on a harness edit, force a restore-key (prefix) match against an
        # older cache, and -- because a fresh `git checkout` re-stamps sources to
        # "now" -- make `make` think every cached .fasl is stale and try a partial
        # rebuild that dies "fasl older than source".  Keeping the key to build
        # inputs means a harness/doc edit is an EXACT hit (no rebuild at all).
        run: |
          echo "value=axiom-sbcl-${{ runner.arch }}-${{ hashFiles('src/interp/**', 'src/algebra/**', 'books/**.pamphlet', 'Makefile*', 'lsp/Makefile.pamphlet') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache (obj/int/mnt/lsp)
        id: cache
        # Restore-only + a success-gated save below: actions/cache's combined
        # action saves in a post-step even when the build FAILED, which would
        # persist a half-built tree and let the next run exact-hit it green.
        # No restore-keys: on a miss we rm + clean-build anyway, so a prefix
        # match would only waste a download of a tree we delete.
        uses: actions/cache/restore@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Build axiom (SBCL, interp + algebra only)
        id: build
        run: |
          set -ex
          export AXIOM="$PWD/mnt/MACOSX"
          export PATH="$AXIOM/bin:$PATH"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            # Exact key hit: build inputs are byte-identical to when this cache was
            # saved, so the restored tree (interpsys, AXIOMsys, algebra) is already
            # correct.  Do NOT rebuild -- a fresh `git checkout` stamps sources to
            # "now", which makes `make` see every cached .fasl as stale and load a
            # half-recompiled fasl ("fasl older than source" -> fatal).  Touch the
            # artifacts newer than the checkout so make has nothing to do, then
            # just verify the binaries.
            find obj int mnt lsp -exec touch {} + 2>/dev/null || true
            test -x obj/MACOSX/bin/interpsys
            test -x mnt/MACOSX/bin/AXIOMsys
            echo "exact cache hit -- reused built tree, skipped rebuild"
          else
            # Miss (cold runner, or a build input changed): build CLEAN.  Delete any
            # restore-key-matched partial tree so we never load a stale fasl, and
            # use pipefail so a real `make` failure fails the job -- the old
            # `| tee | tail` returned tail's status and masked make's exit code.
            set -o pipefail
            rm -rf obj int mnt
            # The regression tests need only interpsys + the algebra (no graphics/
            # hyperdoc), so build just those SRCDIRS and skip libspad, whose C
            # library bundles X11/graphics C that cannot build on macOS.
            make rootdirs axiom.sty tanglec lspdir LISPFLAVOR=sbcl CC=/usr/bin/clang \
              2>&1 | tee /tmp/build.log | tail -n 200
            # the `all` recipe normally generates this then runs the cascade.
            books/tanglec Makefile.pamphlet "Makefile.MACOSX" > Makefile.MACOSX
            # Shrink SRCDIRS by editing the generated Makefile's own `SRCDIRS:="..."`
            # line, NOT a command-line override: a cmdline SRCDIRS= propagates to
            # sub-makes through MAKEFLAGS with its quotes intact, so src/Makefile
            # sees the literal `"interpdir` as a target and dies `No rule to make
            # target`.  Editing the := line keeps the quotes surviving only the
            # ENV-string -> shell hop in `cd src; ${ENV} ${MAKE}`.
            perl -0pi -e 's/^SRCDIRS:="[^"]*"/SRCDIRS:="interpdir sharedir algebradir"/m' Makefile.MACOSX
            time make -f Makefile.MACOSX LISPFLAVOR=sbcl CC=/usr/bin/clang \
              2>&1 | tee -a /tmp/build.log | tail -n 4000
            test -x obj/MACOSX/bin/interpsys
            test -x mnt/MACOSX/bin/AXIOMsys
          fi

      - name: Smoke test (1+1, factor, integrate)
        run: |
          export AXIOM="$PWD/mnt/MACOSX" DAASE="$PWD/src/share"
          printf '%s\n' ')set messages time off' '1 + 1' 'factor(120)' 'integrate(x^2,x)' ')quit' \
            | mnt/MACOSX/bin/AXIOMsys 2>&1 | tee /tmp/smoke.log
          grep -q 'Type: PositiveInteger' /tmp/smoke.log

      - name: Save build cache
        # Persist ONLY a freshly built tree that also passed smoke -- never a
        # partial/broken one.  Skipped on an exact hit (nothing new to save).
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/smoke.log
          if-no-files-found: ignore

  mac-test:
    needs: mac-build
    # Always run the sharded suite: at ~5 min across 5 shards it is cheap enough
    # that an unconditional run is simpler and safer than a skip-gate, and it
    # guarantees a harness or test-input edit is actually exercised (those files
    # are deliberately NOT in the build cache key, so they no longer perturb the
    # build).
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      # One shard's failure must not cancel the others -- we want every shard's
      # result, and a real port bug may surface in only one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      LISPFLAVOR: sbcl
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install test dependencies
        run: |
          set -x
          # No C is compiled here (we restore the built tree), so no SDK/X11 --
          # just the Lisp host + GNU tools the harness uses (gtimeout, gawk, ...).
          # Drop runner-preinstalled third-party taps we do not use; brew otherwise
          # scans them and surfaces their formula-import errors + deprecations as
          # job annotations (hashicorp vagrant.rb import failure, aws/tap SAM notice).
          brew untap aws/tap azure/bicep hashicorp/tap 2>/dev/null || true
          brew install sbcl gawk gnu-sed grep coreutils || true
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin"      >> "$GITHUB_PATH"

      - name: Restore build artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          # Restore exactly what `build` saved; fail loudly rather than test a
          # stale/mismatched build via a restore-key fallback.
          key: ${{ needs.mac-build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify restored build
        run: |
          test -x obj/MACOSX/bin/interpsys
          test -x obj/MACOSX/bin/lisp
          test -x mnt/MACOSX/bin/AXIOMsys

      - name: Run regression shard ${{ matrix.shard }}/5
        run: |
          chmod +x ci/run-regression.sh
          ./ci/run-regression.sh

      - name: Upload shard log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-shard-${{ matrix.shard }}
          path: /tmp/axci/results.txt
          if-no-files-found: ignore

  # Compile the X11 GUI subsystems the regression build deliberately skips:
  # graphics (viewman/view2d/view3d), HyperDoc (hypertex/htadd + ht.db), and
  # the session manager (sman/session/spadclient/clef).  This proves the
  # macOS/XQuartz arm64 port compiles + links; it does NOT run them (the GUI
  # needs a live X display, absent on the runner).  Independent of build/test
  # so the regression pipeline stays fast and green regardless.
  mac-gui-build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      LISPFLAVOR: sbcl
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install build dependencies (+ XQuartz for /opt/X11)
        run: |
          set -x
          # Drop runner-preinstalled third-party taps we do not use; brew otherwise
          # scans them and surfaces their formula-import errors + deprecations as
          # job annotations (hashicorp vagrant.rb import failure, aws/tap SAM notice).
          brew untap aws/tap azure/bicep hashicorp/tap 2>/dev/null || true
          brew install sbcl gawk gnu-sed grep coreutils || true
          # XQuartz supplies /opt/X11 (libX11/libXpm/libXt/libSM/libICE + headers)
          # that the graphics + HyperDoc C links against.
          brew install --cask xquartz || true
          test -d /opt/X11/include/X11
          test -e /opt/X11/lib/libXpm.dylib
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin"      >> "$GITHUB_PATH"
          # macos-14 keeps C headers in the SDK, not /usr/include; point CPATH
          # there so the GUI C (and tanglec) resolve <stdio.h> etc.
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CPATH=$(xcrun --show-sdk-path)/usr/include"
          } >> "$GITHUB_ENV"

      - name: Build GUI (libspad + graphics + HyperDoc + sman)
        run: |
          set -exo pipefail
          export AXIOM="$PWD/mnt/MACOSX"
          export PATH="$AXIOM/bin:$PATH"
          # Dirs, axiom.sty, tanglec, and the SBCL lisp image (depsys) that
          # HyperDoc's page tangler runs on.  No algebra/interp build needed.
          make rootdirs axiom.sty tanglec lspdir LISPFLAVOR=sbcl CC=/usr/bin/clang \
            2>&1 | tee /tmp/gui.log | tail -n 100
          # libspad.a: the X11-coupled C archive the GUI binaries link against.
          make libspad LISPFLAVOR=sbcl CC=/usr/bin/clang \
            2>&1 | tee -a /tmp/gui.log | tail -n 40
          # Build only the GUI SRCDIRS through the tangled platform makefile.
          # Edit the SRCDIRS:= line (not a cmdline override, whose quotes leak
          # through MAKEFLAGS into sub-makes and break them).
          books/tanglec Makefile.pamphlet "Makefile.MACOSX" > Makefile.MACOSX
          perl -0pi -e 's/^SRCDIRS:="[^"]*"/SRCDIRS:="graphdir hyperdir smandir"/m' Makefile.MACOSX
          make -f Makefile.MACOSX srcdir LISPFLAVOR=sbcl CC=/usr/bin/clang \
            2>&1 | tee -a /tmp/gui.log | tail -n 300

      - name: Verify GUI binaries built + linked against XQuartz
        run: |
          set -e
          for b in lib/viewman lib/view2d lib/view3d bin/viewAlone \
                   bin/hypertex bin/htadd bin/sman bin/clef \
                   lib/session lib/spadclient; do
            test -x "mnt/MACOSX/$b" && echo "ok  $b" || { echo "MISSING $b"; exit 1; }
          done
          test -s mnt/MACOSX/doc/ht.db && echo "ok  ht.db ($(wc -c < mnt/MACOSX/doc/ht.db) bytes)"
          test -f obj/MACOSX/lib/libspad.a && echo "ok  libspad.a"
          # libspadsock.dylib is the socket FFI the SBCL image dlopens at
          # runtime; if -dynamiclib silently failed the GUI binaries still
          # link but every sman AXIOMsys falls back to stubs and HyperDoc
          # never connects -- the exact bug this work fixed, so gate on it.
          test -f mnt/MACOSX/lib/libspadsock.dylib && echo "ok  libspadsock.dylib" \
            || { echo "MISSING libspadsock.dylib (socket FFI)"; exit 1; }
          otool -L mnt/MACOSX/bin/hypertex | grep -q '/opt/X11/lib/libX11' && echo "ok  hypertex -> libX11"
          otool -L mnt/MACOSX/lib/viewman  | grep -q '/opt/X11/lib/libXpm' && echo "ok  viewman -> libXpm"

      - name: Upload GUI build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mac-gui-build-log
          path: /tmp/gui.log
          if-no-files-found: ignore

  # ---- Linux (Ubuntu x86_64) SBCL build + regression -------------------------
  # Proves the SBCL port is not macOS-specific: builds interp + algebra under
  # SBCL on ubuntu-latest via the Makefile.LINUX target, then runs the same
  # sharded regression suite.  Two Linux-specific facts drive the differences
  # from the macOS jobs:
  #   - The distro SBCL (2.2.9 on 24.04) miscompiles the algebra (a category
  #     compile dies "Value of CVEC in (LENGTH CVEC) ... not a SEQUENCE"), so we
  #     install the official 2.6.3 x86_64 binary -- the version the port is
  #     validated on.
  #   - The platform dir is mnt/LINUX (AXIOM basename selects SYS=LINUX), built
  #     with native gcc + system X11; no SDK/CPATH hack and no XQuartz.
  # The cache key carries runner.arch, so the X64 Linux cache never collides
  # with the ARM64 macOS cache even though the hashFiles() inputs match.
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    env:
      LISPFLAVOR: sbcl
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install build dependencies (+ SBCL 2.6.3 binary)
        run: |
          set -ex
          sudo apt-get update -qq
          # gawk: the Makefile uses gawk.  build-essential: gcc/make for tanglec
          # and the algebra C.  perl: the SRCDIRS edit.  curl/bzip2: fetch SBCL.
          sudo apt-get install -y --no-install-recommends \
            gawk build-essential perl curl bzip2 ca-certificates
          # The distro SBCL miscompiles the algebra; install the validated 2.6.3.
          curl -fsSL -o /tmp/sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.3/sbcl-2.6.3-x86-64-linux-binary.tar.bz2
          tar -C /tmp -xjf /tmp/sbcl.tar.bz2
          ( cd /tmp/sbcl-*-x86-64-linux && sudo sh install.sh )
          sbcl --version

      - name: Compute cache key
        id: key
        run: |
          echo "value=axiom-sbcl-${{ runner.arch }}-${{ hashFiles('src/interp/**', 'src/algebra/**', 'books/**.pamphlet', 'Makefile*', 'lsp/Makefile.pamphlet') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache (obj/int/mnt/lsp)
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Build axiom (SBCL, interp + algebra only)
        run: |
          set -ex
          export AXIOM="$PWD/mnt/LINUX" DAASE="$PWD/src/share"
          export PATH="$AXIOM/bin:$PATH"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            # Exact key hit: reuse the restored tree, touch it newer than the
            # checkout so make has nothing to do, then verify the binaries.
            find obj int mnt lsp -exec touch {} + 2>/dev/null || true
            test -x obj/LINUX/bin/interpsys
            test -x mnt/LINUX/bin/AXIOMsys
            echo "exact cache hit -- reused built tree, skipped rebuild"
          else
            set -o pipefail
            rm -rf obj int mnt
            # interp + algebra only (no graphics/hyperdoc); SYS=LINUX is selected
            # by AXIOM's basename, which tangles the Makefile.LINUX stanza.
            make rootdirs axiom.sty tanglec lspdir LISPFLAVOR=sbcl CC=gcc \
              2>&1 | tee /tmp/build.log | tail -n 200
            books/tanglec Makefile.pamphlet "Makefile.LINUX" > Makefile.LINUX
            perl -0pi -e 's/^SRCDIRS:="[^"]*"/SRCDIRS:="interpdir sharedir algebradir"/m' Makefile.LINUX
            make -f Makefile.LINUX LISPFLAVOR=sbcl CC=gcc \
              2>&1 | tee -a /tmp/build.log | tail -n 4000
            test -x obj/LINUX/bin/interpsys
            test -x mnt/LINUX/bin/AXIOMsys
          fi

      - name: Smoke test (1+1, factor, integrate)
        run: |
          export AXIOM="$PWD/mnt/LINUX" DAASE="$PWD/src/share"
          printf '%s\n' ')set messages time off' '1 + 1' 'factor(120)' 'integrate(x^2,x)' ')quit' \
            | mnt/LINUX/bin/AXIOMsys 2>&1 | tee /tmp/smoke.log
          grep -q 'Type: PositiveInteger' /tmp/smoke.log

      - name: Save build cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-build-log
          path: |
            /tmp/build.log
            /tmp/smoke.log
          if-no-files-found: ignore

  linux-test:
    needs: linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      LISPFLAVOR: sbcl
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install test dependencies (+ SBCL 2.6.3 binary)
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gawk build-essential perl curl bzip2 ca-certificates
          curl -fsSL -o /tmp/sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.3/sbcl-2.6.3-x86-64-linux-binary.tar.bz2
          tar -C /tmp -xjf /tmp/sbcl.tar.bz2
          ( cd /tmp/sbcl-*-x86-64-linux && sudo sh install.sh )
          sbcl --version

      - name: Restore build artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ needs.linux-build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify restored build
        run: |
          test -x obj/LINUX/bin/interpsys
          test -x obj/LINUX/bin/lisp
          test -x mnt/LINUX/bin/AXIOMsys

      - name: Run regression shard ${{ matrix.shard }}/5
        run: |
          export AXIOM="$PWD/mnt/LINUX" DAASE="$PWD/src/share"
          chmod +x ci/run-regression.sh
          ./ci/run-regression.sh

      - name: Upload shard log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-regression-shard-${{ matrix.shard }}
          path: /tmp/axci/results.txt
          if-no-files-found: ignore

  # ---- Linux GUI build + headless (Xvfb) draw E2E -----------------------------
  # The macOS runner has no X server, so mac-gui-build can only prove the GUI
  # compiles + links.  The Linux runner can start a virtual X server (Xvfb), so
  # this job goes further: it builds the full system + GUI and then actually RUNS
  # the graphics stack -- driving `axiom -gr -ht -ihere` to draw a plot and
  # asserting the X11 viewport window appears.  Self-contained (no cache) so the
  # algebra build runs in parallel with linux-build rather than serialised behind
  # it; restoring linux-build's cache instead is a possible future optimisation.
  linux-gui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LISPFLAVOR: sbcl
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install build + X11 + Xvfb deps (+ SBCL 2.6.3 binary)
        run: |
          set -ex
          sudo apt-get update -qq
          # X11 -dev: the graphics + HyperDoc C links -lX11 -lXpm -lXt -lSM -lICE.
          # xvfb: a virtual X server for the headless draw.  x11-utils (xwininfo)
          # + x11-apps (xwd) + netpbm let the E2E inspect/capture the viewport.
          sudo apt-get install -y --no-install-recommends \
            gawk build-essential perl curl bzip2 ca-certificates \
            libx11-dev libxpm-dev libxt-dev libsm-dev libice-dev \
            xvfb x11-utils x11-apps netpbm
          curl -fsSL -o /tmp/sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.3/sbcl-2.6.3-x86-64-linux-binary.tar.bz2
          tar -C /tmp -xjf /tmp/sbcl.tar.bz2
          ( cd /tmp/sbcl-*-x86-64-linux && sudo sh install.sh )
          sbcl --version

      - name: Build full system + GUI (graphics + HyperDoc + sman)
        run: |
          set -exo pipefail
          export AXIOM="$PWD/mnt/LINUX" DAASE="$PWD/src/share"
          export PATH="$AXIOM/bin:$PATH"
          make rootdirs axiom.sty tanglec lspdir LISPFLAVOR=sbcl CC=gcc \
            2>&1 | tee /tmp/gui.log | tail -n 80
          # libspad.a (X11-coupled C archive) + libspadsock.so (the SBCL socket
          # FFI the Lisp image dlopens at runtime).
          make libspad LISPFLAVOR=sbcl CC=gcc \
            2>&1 | tee -a /tmp/gui.log | tail -n 40
          # Build the whole system in one tree: core (interp+algebra, needed to RUN
          # a draw) plus the GUI dirs.  Edit the SRCDIRS:= line, not a cmdline
          # override (whose quotes leak through MAKEFLAGS and break sub-makes).
          books/tanglec Makefile.pamphlet "Makefile.LINUX" > Makefile.LINUX
          perl -0pi -e 's/^SRCDIRS:="[^"]*"/SRCDIRS:="interpdir sharedir algebradir graphdir hyperdir smandir"/m' Makefile.LINUX
          make -f Makefile.LINUX srcdir LISPFLAVOR=sbcl CC=gcc \
            2>&1 | tee -a /tmp/gui.log | tail -n 300

      - name: Verify GUI binaries + libspadsock.so + native X11 links
        run: |
          set -e
          # The standalone viewer tangles to lowercase `viewalone`; the macOS job's
          # `viewAlone` check only matches there via the case-insensitive HFS volume.
          for b in lib/viewman lib/view2d lib/view3d bin/viewalone \
                   bin/hypertex bin/htadd bin/sman bin/clef \
                   lib/session lib/spadclient bin/AXIOMsys; do
            test -x "mnt/LINUX/$b" && echo "ok  $b" || { echo "MISSING $b"; exit 1; }
          done
          test -s mnt/LINUX/doc/ht.db && echo "ok  ht.db ($(wc -c < mnt/LINUX/doc/ht.db) bytes)"
          # Without libspadsock.so the draw returns a viewport object but never
          # reaches viewman -- gate on it, like the macOS .dylib check.
          test -f mnt/LINUX/lib/libspadsock.so && echo "ok  libspadsock.so" \
            || { echo "MISSING libspadsock.so (socket FFI)"; exit 1; }
          ldd mnt/LINUX/bin/hypertex | grep -q 'libX11' && echo "ok  hypertex -> libX11"
          ldd mnt/LINUX/lib/viewman  | grep -q 'libXpm' && echo "ok  viewman -> libXpm"

      - name: Headless draw E2E under Xvfb
        run: |
          set -e
          export AXIOM="$PWD/mnt/LINUX" DAASE="$PWD/src/share"
          export PATH="$AXIOM/bin:$PATH" DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          chmod +x ci/xvfb-draw-e2e.sh
          ./ci/xvfb-draw-e2e.sh

      - name: Upload GUI build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-gui-build-log
          path: |
            /tmp/gui.log
            /tmp/xvfb.log
          if-no-files-found: ignore
