name: axiom SBCL build + regression

# Builds Axiom from source under SBCL on Apple Silicon (the only LISPFLAVOR=sbcl
# path is Makefile.MACOSX), then runs the src/input regression suite (excluding
# six non-portable tests, see ci/run-regression.sh) SHARDED across 5 parallel
# macOS jobs.
#
# Why this shape:
#  - The suite is dominated by ~106 rich*/richder* (Risch integration) tests at
#    60-120s each; on one 3-core runner that is ~22 min even with a dynamic
#    queue.  GitHub caps FREE macOS concurrency at 5 jobs, so we split the suite
#    into 5 timing-balanced shards that run at once -> ~5 min wall-clock.
#  - The algebra build is long but cached on a source hash; the build runs once
#    in `build`, and the 5 `test` shards restore that cache instead of rebuilding.
#  - An exact cache-key hit means nothing affecting the build or the regression
#    outcome changed, so the whole `test` matrix is skipped.

on:
  push:
    branches: ['**']        # every branch (jt, master, feature branches)
    paths-ignore:
      - 'books/**.pdf'
      - 'changelog'
  workflow_dispatch:

# Never let two builds of the same ref race on the cache / burn the 5-job cap.
concurrency:
  group: sbcl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    env:
      LISPFLAVOR: sbcl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          set -x
          brew update >/dev/null || true
          # sbcl: the Lisp host. gawk: Makefile uses gawk. gnu-sed/grep: a few
          # recipes assume GNU behaviour. coreutils: gtimeout for the runner.
          brew install sbcl gawk gnu-sed grep coreutils || true
          sbcl --version
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin"      >> "$GITHUB_PATH"
          # macos-14 has no /usr/include and clang's default sysroot is /, so
          # the few C bits (tanglec) cannot find <stdio.h> etc.  Point CPATH at
          # the SDK so relative includes resolve.  We build only interp+algebra
          # (see below), which compiles no X11/graphics C, so no X11 is needed.
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CPATH=$(xcrun --show-sdk-path)/usr/include"
          } >> "$GITHUB_ENV"

      - name: Compute cache key
        id: key
        # Single source of truth for the key so the `test` shards restore exactly
        # what `build` saved.  Hash ONLY genuine build inputs -- NOT ci/run-
        # regression.sh or the workflow.  Including non-build files would bust the
        # key on a harness edit, force a restore-key (prefix) match against an
        # older cache, and -- because a fresh `git checkout` re-stamps sources to
        # "now" -- make `make` think every cached .fasl is stale and try a partial
        # rebuild that dies "fasl older than source".  Keeping the key to build
        # inputs means a harness/doc edit is an EXACT hit (no rebuild at all).
        run: |
          echo "value=axiom-sbcl-${{ runner.arch }}-${{ hashFiles('src/interp/**', 'src/algebra/**', 'books/**.pamphlet.org', 'Makefile*', 'lsp/Makefile.pamphlet.org') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache (obj/int/mnt/lsp)
        id: cache
        # Restore-only + a success-gated save below: actions/cache's combined
        # action saves in a post-step even when the build FAILED, which would
        # persist a half-built tree and let the next run exact-hit it green.
        # No restore-keys: on a miss we rm + clean-build anyway, so a prefix
        # match would only waste a download of a tree we delete.
        uses: actions/cache/restore@v4
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Regenerate pamphlets from org
        # The .pamphlet sources were migrated to .pamphlet.org (single source of
        # truth).  untanglec rebuilds the exact .pamphlet bytes from each .org so
        # tanglec + the sub-Makefiles below run byte-identically to before the
        # migration.  Cheap (~1k files of plain C), so run it unconditionally;
        # on an exact cache hit the regenerated files are simply unused.
        run: make regen-pamphlets CC=/usr/bin/clang

      - name: Build axiom (SBCL, interp + algebra only)
        id: build
        run: |
          set -ex
          export AXIOM="$PWD/mnt/MACOSX"
          export PATH="$AXIOM/bin:$PATH"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            # Exact key hit: build inputs are byte-identical to when this cache was
            # saved, so the restored tree (interpsys, AXIOMsys, algebra) is already
            # correct.  Do NOT rebuild -- a fresh `git checkout` stamps sources to
            # "now", which makes `make` see every cached .fasl as stale and load a
            # half-recompiled fasl ("fasl older than source" -> fatal).  Touch the
            # artifacts newer than the checkout so make has nothing to do, then
            # just verify the binaries.
            find obj int mnt lsp -exec touch {} + 2>/dev/null || true
            test -x obj/MACOSX/bin/interpsys
            test -x mnt/MACOSX/bin/AXIOMsys
            echo "exact cache hit -- reused built tree, skipped rebuild"
          else
            # Miss (cold runner, or a build input changed): build CLEAN.  Delete any
            # restore-key-matched partial tree so we never load a stale fasl, and
            # use pipefail so a real `make` failure fails the job -- the old
            # `| tee | tail` returned tail's status and masked make's exit code.
            set -o pipefail
            rm -rf obj int mnt
            # The regression tests need only interpsys + the algebra (no graphics/
            # hyperdoc), so build just those SRCDIRS and skip libspad, whose C
            # library bundles X11/graphics C that cannot build on macOS.
            make rootdirs axiom.sty tanglec lspdir LISPFLAVOR=sbcl CC=/usr/bin/clang \
              2>&1 | tee /tmp/build.log | tail -n 200
            # the `all` recipe normally generates this then runs the cascade.
            books/tanglec Makefile.pamphlet "Makefile.MACOSX" > Makefile.MACOSX
            # Shrink SRCDIRS by editing the generated Makefile's own `SRCDIRS:="..."`
            # line, NOT a command-line override: a cmdline SRCDIRS= propagates to
            # sub-makes through MAKEFLAGS with its quotes intact, so src/Makefile
            # sees the literal `"interpdir` as a target and dies `No rule to make
            # target`.  Editing the := line keeps the quotes surviving only the
            # ENV-string -> shell hop in `cd src; ${ENV} ${MAKE}`.
            perl -0pi -e 's/^SRCDIRS:="[^"]*"/SRCDIRS:="interpdir sharedir algebradir"/m' Makefile.MACOSX
            time make -f Makefile.MACOSX LISPFLAVOR=sbcl CC=/usr/bin/clang \
              2>&1 | tee -a /tmp/build.log | tail -n 4000
            test -x obj/MACOSX/bin/interpsys
            test -x mnt/MACOSX/bin/AXIOMsys
          fi

      - name: Smoke test (1+1, factor, integrate)
        run: |
          export AXIOM="$PWD/mnt/MACOSX" DAASE="$PWD/src/share"
          printf '%s\n' ')set messages time off' '1 + 1' 'factor(120)' 'integrate(x^2,x)' ')quit' \
            | mnt/MACOSX/bin/AXIOMsys 2>&1 | tee /tmp/smoke.log
          grep -q 'Type: PositiveInteger' /tmp/smoke.log

      - name: Save build cache
        # Persist ONLY a freshly built tree that also passed smoke -- never a
        # partial/broken one.  Skipped on an exact hit (nothing new to save).
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          key: ${{ steps.key.outputs.value }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/smoke.log
          if-no-files-found: ignore

  test:
    needs: build
    # Always run the sharded suite: at ~5 min across 5 shards it is cheap enough
    # that an unconditional run is simpler and safer than a skip-gate, and it
    # guarantees a harness or test-input edit is actually exercised (those files
    # are deliberately NOT in the build cache key, so they no longer perturb the
    # build).
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      # One shard's failure must not cancel the others -- we want every shard's
      # result, and a real port bug may surface in only one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      LISPFLAVOR: sbcl
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install test dependencies
        run: |
          set -x
          # The only C compiled here is untanglec (a tiny self-contained tool)
          # that regenerates the .pamphlet sources the regression scans, so point
          # CPATH at the SDK like the build job does.  Plus the Lisp host + GNU
          # tools the harness uses (gtimeout, gawk, ...).
          brew install sbcl gawk gnu-sed grep coreutils || true
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin"      >> "$GITHUB_PATH"
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CPATH=$(xcrun --show-sdk-path)/usr/include"
          } >> "$GITHUB_ENV"

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            obj
            int
            mnt
            lsp/Makefile
          # Restore exactly what `build` saved; fail loudly rather than test a
          # stale/mismatched build via a restore-key fallback.
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Verify restored build
        run: |
          test -x obj/MACOSX/bin/interpsys
          test -x obj/MACOSX/bin/lisp
          test -x mnt/MACOSX/bin/AXIOMsys

      - name: Regenerate pamphlets from org
        # run-regression.sh scans src/input/Makefile.pamphlet, the per-test
        # *.input.pamphlet, and books/bookvol10.pamphlet -- all migrated to .org.
        # The build tree is restored from cache, so this only re-materialises the
        # .pamphlet sources the suite reads directly.
        run: make regen-pamphlets CC=/usr/bin/clang

      - name: Run regression shard ${{ matrix.shard }}/5
        run: |
          chmod +x ci/run-regression.sh
          ./ci/run-regression.sh

      - name: Upload shard log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-shard-${{ matrix.shard }}
          path: /tmp/axci/results.txt
          if-no-files-found: ignore
